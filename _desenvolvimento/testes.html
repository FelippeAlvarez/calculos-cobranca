<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Testes do motor de cálculo</title>
<style>body{font:14px Arial;margin:20px}.ok{color:#176b2c}.erro{color:#b3261e;font-weight:bold}pre{background:#f4f4f4;padding:8px}</style></head>
<body><h1>Testes do motor de cálculo</h1><div id="saida"></div>
<script src="../app/util.js"></script>
<script>
// Índices fictícios: IPCA 1% ao mês, taxa legal 0,5% ao mês, SELIC 1% ao mês (contas conferíveis à mão)
const D = { config: { padroes: {} }, indices: { series: {} } };
for (const [n, v] of [['IPCA', 1], ['Taxa legal', 0.5], ['SELIC', 1]]) {
  D.indices.series[n] = {};
  for (let m = '2019-01'; m <= '2026-09'; m = addMes(m, 1)) D.indices.series[n][m] = v;
}
</script>
<script src="../app/indices.js"></script>
<script src="../app/calculo.js"></script>
<script src="../app/series.js"></script>
<script src="../app/acordo.js"></script>
<script>
const res = [];
const perto = (a, b, tol = 0.011) => Math.abs(a - b) <= tol;
function confere(nome, obtido, esperado, tol) {
  res.push({ nome, ok: perto(obtido, esperado, tol), obtido, esperado });
}
const rub = (valor, desde, regimes, extra = {}) => ({ id: 'r' + Math.random(), descricao: 'Rubrica', valor, corrDesde: desde, jurosDesde: desde, regimes, ...extra });
const IPCA1 = [{ desde: '', indice: 'IPCA', juros: 'mensal', taxa: 1 }];
const calc = (o, data) => calcular({ tipo: 'judicial', rubricas: [], custas: [], honorarios: [], multas: [], amortizacoes: [], ...o }, data);

// 1) IPCA + 1% a.m. simples
{
  const r = calc({ rubricas: [rub(10000, '2024-01-15', IPCA1)] }, '2024-07-15');
  const corr = 10000 * Math.pow(1.01, 6), juros = corr * 0.01 / 30 * 182;
  confere('1. corrigido', r.itens[0].principal, corr);
  confere('1. juros', r.itens[0].juros, juros);
  confere('1. total', r.total, r2(corr) + r2(juros));
}
// 2) Transição da Lei 14.905/2024
{
  const regs = [{ desde: '', indice: 'IPCA', juros: 'mensal', taxa: 1 }, { desde: '2024-08-30', indice: 'IPCA', juros: 'legal' }];
  const r = calc({ rubricas: [rub(10000, '2024-06-10', regs)] }, '2024-10-10');
  const corr = 10000 * Math.pow(1.01, 4);
  const taxa = 0.01 / 30 * 81 + 0.005 / 31 * 2 + 0.005 + 0.005 / 31 * 9;
  confere('2. corrigido', r.itens[0].principal, corr);
  confere('2. juros', r.itens[0].juros, corr * taxa);
}
// 3) Amortização imputada primeiro nos juros
{
  const r = calc({ rubricas: [rub(10000, '2024-01-01', IPCA1)], amortizacoes: [{ data: '2024-04-01', valor: 1000, imputacao: 'juros', destino: 'proporcional' }] }, '2024-07-01');
  const f1 = Math.pow(1.01, 3), f2 = Math.pow(1.01, 6);
  const J1 = 10000 * 0.01 / 30 * 91;               // em unidades da data-base
  const Pb = 10000 - (1000 / f1 - J1);
  const J2 = Pb * 0.01 / 30 * 91;
  confere('3. principal', r.itens[0].principal, Pb * f2);
  confere('3. juros', r.itens[0].juros, J2 * f2);
  confere('3. juros imputados', r.amort[0].imputado[0].juros, J1 * f1);
}
// 3b) Amortização imputada primeiro no principal
{
  const r = calc({ rubricas: [rub(10000, '2024-01-01', IPCA1)], amortizacoes: [{ data: '2024-04-01', valor: 1000, imputacao: 'principal', destino: 'proporcional' }] }, '2024-07-01');
  const f1 = Math.pow(1.01, 3), f2 = Math.pow(1.01, 6);
  const J1 = 10000 * 0.01 / 30 * 91, Pb = 10000 - 1000 / f1, J2 = Pb * 0.01 / 30 * 91;
  confere('3b. principal', r.itens[0].principal, Pb * f2);
  confere('3b. juros (vencidos corrigidos, sem juros sobre juros)', r.itens[0].juros, (J1 + J2) * f2);
}
// 4) Honorários sobre a condenação, custas e art. 523
{
  const r = calc({
    rubricas: [rub(10000, '2024-01-01', IPCA1)], regimes: IPCA1,
    custas: [{ id: 'c1', data: '2024-02-01', descricao: 'Custas', valor: 500, corrigir: true }],
    honorarios: [{ id: 'h1', forma: 'condenacao', pct: 10 }],
    art523: { aplicar: true, multa: 10, honorarios: 10, baseHonorarios: true, baseCustas: false, baseMultas: true },
  }, '2024-07-01');
  const rubF = 10000 * Math.pow(1.01, 6) * (1 + 0.01 / 30 * 182);
  confere('4. base do art. 523 (verba + honorários, atualizados)', r.r523.baseFinal, rubF * 1.1, 0.02);
  confere('4. multa do art. 523', r.itens.find(i => i.itemId === 'art523-multa').total, rubF * 0.11, 0.02);
  confere('4. honorários sucumbenciais', r.itens.find(i => i.itemId === 'h1').total, rubF * 0.1, 0.02);
  confere('4. custas', r.itens.find(i => i.itemId === 'c1').total, 500 * Math.pow(1.01, 5));
}
// 5) UFIR-RJ até a Lei 14.905 e SELIC depois
{
  const regs = [{ desde: '', indice: 'UFIR-RJ', juros: 'mensal', taxa: 1 }, { desde: '2024-08-30', indice: 'Nenhum', juros: 'selic' }];
  const r = calc({ rubricas: [rub(1000, '2020-03-10', regs)] }, '2024-10-10');
  const f = 4.5373 / 3.5550;
  const taxa = 0.01 / 30 * diasEntre('2020-03-10', '2024-08-30') + 0.01 / 31 * 2 + 0.01 + 0.01 / 31 * 9;
  confere('5. corrigido', r.itens[0].principal, 1000 * f);
  confere('5. juros', r.itens[0].juros, 1000 * f * taxa);
}
// 6) Dano moral: juros desde o evento (Súm. 54) e correção desde o arbitramento (Súm. 362)
{
  const r = calc({ rubricas: [rub(20000, '2024-03-05', IPCA1, { jurosDesde: '2023-01-10' })] }, '2024-06-05');
  const f = Math.pow(1.01, 3);
  confere('6. juros desde o evento sobre o valor corrigido', r.itens[0].juros, 20000 * f * 0.01 / 30 * diasEntre('2023-01-10', '2024-06-05'));
}
// 7) Pagamento em item específico com sobra para os demais (mais antigos primeiro) e excedente
{
  const a = rub(1000, '2024-01-01', [{ desde: '', indice: 'Nenhum', juros: 'nenhum' }]), b = rub(500, '2024-02-01', [{ desde: '', indice: 'Nenhum', juros: 'nenhum' }]);
  const r = calc({ rubricas: [a, b], amortizacoes: [{ data: '2024-03-01', valor: 1700, imputacao: 'juros', destino: a.id }] }, '2024-04-01');
  confere('7. item A quitado', r.itens.find(i => i.itemId === a.id).total, 0);
  confere('7. item B quitado', r.itens.find(i => i.itemId === b.id).total, 0);
  confere('7. excedente', r.excedente, 200);
}
// 8) Multa contratual e capitalização mensal
{
  const regs = [{ desde: '', indice: 'IPCA', juros: 'mensal', taxa: 2, capitalizar: true }];
  const r = calc({ rubricas: [rub(1000, '2024-01-01', regs, { multa: 2 })] }, '2024-04-01');
  const f = Math.pow(1.01, 3), d = 91;
  confere('8. multa', r.itens[0].multa, 1000 * f * 0.02);
  confere('8. juros capitalizados', r.itens[0].juros, 1000 * f * (Math.pow(1.02, d / 30) - 1));
}
// 9) Astreintes com teto e multa sobre o valor da causa
{
  const r = calc({
    valorCausa: { valor: 50000, data: '2024-01-01' },
    multas: [{ id: 'm1', forma: 'diaria', valorDia: 100, inicio: '2024-02-01', fim: '2024-02-29', teto: 2000, corrDesde: '2024-02-29' },
      { id: 'm2', forma: 'pctCausa', pct: 2 }],
    regimes: IPCA1,
  }, '2024-05-01');
  confere('9. astreintes limitadas ao teto, corrigidas', r.itens.find(i => i.itemId === 'm1').total, 2000 * Math.pow(1.01, 3));
  confere('9. multa de 2% da causa corrigida', r.itens.find(i => i.itemId === 'm2').total, 1000 * Math.pow(1.01, 4));
}
// 10) Pagamento parcial no prazo reduz a base do art. 523 (§ 2º)
{
  const regs0 = [{ desde: '', indice: 'Nenhum', juros: 'nenhum' }];
  const r = calc({ rubricas: [rub(10000, '2024-01-01', regs0)], regimes: regs0,
    amortizacoes: [{ data: '2024-03-10', valor: 4000, imputacao: 'juros', destino: 'proporcional', noPrazo: true }],
    art523: { aplicar: true, multa: 10, honorarios: 10 } }, '2024-04-01');
  confere('10. base 523 = saldo após o pagamento no prazo', r.r523.baseFinal, 6000);
  confere('10. total', r.total, 7200);
}
// 13) Critérios numa linha (crit) com a Lei 14.905, custas com juros e honorários com outra base
{
  const crit = { indice: 'IPCA', juros: 'mensal', taxa: 1, lei14905: true };
  const r = calc({
    rubricas: [{ id: 'r1', descricao: 'Verba', valor: 10000, corrDesde: '2024-06-10', jurosDesde: '2024-06-10', crit }],
    custas: [{ id: 'c1', descricao: 'Custas', valor: 300, corrDesde: '2024-07-01', jurosDesde: '2024-08-01', crit: { indice: 'IPCA', juros: 'mensal', taxa: 1 } }],
    honorarios: [{ id: 'h1', forma: 'condenacao', pct: 10, fora: ['r1'], outras: [{ valor: 5000, corrDesde: '2024-06-01', jurosDesde: '', crit: { indice: 'IPCA', juros: 'nenhum' } }] }],
  }, '2024-10-10');
  const corr = 10000 * Math.pow(1.01, 4), taxa = 0.01 / 30 * 81 + 0.005 / 31 * 2 + 0.005 + 0.005 / 31 * 9;
  confere('13. verba com transição da Lei 14.905', r.itens.find(i => i.itemId === 'r1').total, r2(corr) + r2(corr * taxa));
  confere('13. custas com juros desde 01/08', r.itens.find(i => i.itemId === 'c1').total, 300 * Math.pow(1.01, 3) * (1 + 0.01 / 30 * diasEntre('2024-08-01', '2024-10-10')));
  confere('13. honorários só sobre a outra base', r.itens.find(i => i.itemId === 'h1').total, 500 * Math.pow(1.01, 4));
}

// 11) Art. 523 com base atualizada (padrão), só a multa, pagamento posterior ao prazo não reduz a base
{
  const a = rub(10000, '2024-01-01', IPCA1);
  const r = calc({ rubricas: [a], regimes: IPCA1,
    amortizacoes: [{ data: '2024-06-01', valor: 3000, imputacao: 'juros', destino: a.id }],
    art523: { aplicar: true, data: '2024-03-01', incluirMulta: true, multa: 10, incluirHonorarios: false, honorarios: 10 } }, '2024-07-01');
  const bruto = 10000 * Math.pow(1.01, 6) * (1 + 0.01 / 30 * 182);
  confere('11. multa = 10% do débito atualizado, sem abater o pagamento posterior', r.itens.find(i => i.itemId === 'art523-multa').total, bruto * 0.1, 0.02);
  confere('11. sem honorários do art. 523', r.itens.filter(i => i.itemId === 'art523-hon').length, 0);
  confere('11. base informada', r.r523.baseFinal, bruto, 0.02);
}
// 12) Data com ano inválido (0017) é ignorada, sem travar
{
  const r = calc({ rubricas: [rub(1000, '0017-12-01', IPCA1)] }, '2024-07-01');
  confere('12. ano inválido ignorado', r.total, 1000);
}

// 14) Amortização nas custas primeiro e o restante proporcionalmente nas verbas
{
  const s = [{ desde: '', indice: 'Nenhum', juros: 'nenhum' }];
  const a = rub(1000, '2024-01-01', s), b = rub(3000, '2024-01-01', s);
  const r = calc({ rubricas: [a, b], custas: [{ id: 'c1', descricao: 'Custas', valor: 200, corrDesde: '2024-01-01', crit: { indice: 'Nenhum', juros: 'nenhum' } }],
    amortizacoes: [{ data: '2024-02-01', valor: 600, imputacao: 'juros', destino: 'custasPrimeiro' }] }, '2024-03-01');
  confere('14. custas quitadas', r.itens.find(i => i.itemId === 'c1').total, 0);
  confere('14. sobra de 400 rateada: verba A', r.itens.find(i => i.itemId === a.id).total, 900);
  confere('14. sobra de 400 rateada: verba B', r.itens.find(i => i.itemId === b.id).total, 2700);
}

/* ---------- Simulação de acordo ---------- */
const S0 = [{ desde: '', indice: 'Nenhum', juros: 'nenhum' }];
const debito10mil = (extra = {}) => ({ tipo: 'judicial', rubricas: [rub(10000, '2024-01-01', S0, { id: 'rA' })], custas: [], honorarios: [], multas: [], amortizacoes: [], ...extra });
const acordo = (p, extra = {}) => ({ data: '2024-03-01', desconto: { modo: 'total', tipo: 'pct', valor: 0 }, sinal: { tipo: 'valor', valor: 0 },
  parcelas: { modo: 'numero', n: 10, taxa: 1, primeiro: '2024-03-31', jurosAte1: true, indice: 'IPCA', ...p }, ...extra });
const amortTotal = ra => ra.cronograma.reduce((s, x) => s + x.amortizacao, 0);
// 15) Tabela Price comum (1º vencimento 30 dias depois, com juros)
{
  const ra = calcularAcordo(debito10mil(), acordo({}));
  const pmt = 10000 * 0.01 / (1 - Math.pow(1.01, -10));
  confere('15. parcela Price', ra.parcela, pmt);
  confere('15. amortizações somam o saldo', amortTotal(ra), 10000);
  confere('15. saldo final zero', ra.cronograma[ra.cronograma.length - 1].saldo, 0);
  confere('15. juros da 1ª parcela (30 dias)', ra.cronograma[0].juros, 100);
}
// 16) Sem juros até o 1º vencimento, que cai 45 dias depois
{
  const ra = calcularAcordo(debito10mil(), acordo({ primeiro: '2024-04-15', jurosAte1: false }));
  confere('16. parcela antecipada', ra.parcela, 10000 * 0.01 / ((1 - Math.pow(1.01, -10)) * 1.01));
  confere('16. 1ª parcela sem juros', ra.cronograma[0].juros, 0);
  confere('16. vencimento da 2ª parcela', ra.cronograma[1].vencimento === '2024-05-15' ? 1 : 0, 1);
}
// 17) Com juros até um 1º vencimento 45 dias depois (juros proporcionais compostos)
{
  const ra = calcularAcordo(debito10mil(), acordo({ primeiro: '2024-04-15' }));
  const SV = 10000 * Math.pow(1.01, 45 / 30);
  confere('17. parcela', ra.parcela, SV * 0.01 / ((1 - Math.pow(1.01, -10)) * 1.01));
  confere('17. juros da 1ª parcela', ra.cronograma[0].juros, SV - 10000);
}
// 18) Valor da parcela informado: número de parcelas e última ajustada
{
  const ra = calcularAcordo(debito10mil(), acordo({ modo: 'valor', valor: 1500 }));
  const n = Math.ceil(-Math.log(1 - 10100 * 0.01 / (1500 * 1.01)) / Math.log(1.01));
  confere('18. número de parcelas', ra.n, n);
  confere('18. amortizações somam o saldo', amortTotal(ra), 10000);
  confere('18. última parcela menor', ra.cronograma[ra.n - 1].valor < 1500 ? 1 : 0, 1);
}
// 19) Desconto de 10% sobre o total e sinal de 20% sobre o valor com desconto
{
  const ra = calcularAcordo(debito10mil(), acordo({}, { desconto: { modo: 'total', tipo: 'pct', valor: 10 }, sinal: { tipo: 'pct', valor: 20 } }));
  confere('19. com desconto', ra.comDesconto, 9000);
  confere('19. sinal', ra.sinal, 1800);
  confere('19. saldo a parcelar', ra.saldo, 7200);
}
// 20) Desconto verba por verba e rateio entre credor e honorários
{
  const c = debito10mil({ honorarios: [{ id: 'h1', forma: 'fixo', valor: 1000, data: '2024-01-01', crit: { indice: 'Nenhum', juros: 'nenhum' } }] });
  const ra = calcularAcordo(c, acordo({ taxa: 0, n: 4 }, { desconto: { modo: 'itens', itens: { rA: { tipo: 'pct', valor: 50 } } } }));
  confere('20. débito', ra.debito, 11000);
  confere('20. com desconto (50% só na verba)', ra.comDesconto, 6000);
  confere('20. parcela sem juros', ra.parcela, 1500);
  confere('20. honorários em cada parcela', ra.cronograma[0].honorarios, 250);
  confere('20. credor em cada parcela', ra.cronograma[0].credor, 1250);
}

/* ---------- Séries mensais ---------- */
const critIPCA1 = { indice: 'IPCA', juros: 'mensal', taxa: 1 };
const serie = (id, descricao, de, ate, valor, extra = {}) => {
  const s = { id, descricao, crit: critIPCA1, multa: 0, juros: 'vencimento', jurosData: '', meses: [], ...extra };
  for (let m = de; m <= ate; m = addMes(m, 1)) s.meses.push({ id: id + m, competencia: m, vencimento: m + '-10', valor, pago: false });
  return s;
};
const esperadoMes = (valor, venc, calc) => {
  let meses = 0; for (let m = venc.slice(0, 7); m < calc.slice(0, 7); m = addMes(m, 1)) meses++;
  const corr = valor * Math.pow(1.01, meses);
  return r2(corr) + r2(corr * 0.01 / 30 * diasEntre(venc, calc));
};
// 21) Duas séries nos mesmos meses (aluguel e condomínio), juros desde cada vencimento
{
  const r = calc({ series: [serie('A', 'Aluguel', '2024-01', '2024-03', 1000), serie('C', 'Condomínio', '2024-01', '2024-03', 500)] }, '2024-04-10');
  const esp = ['2024-01-10', '2024-02-10', '2024-03-10'].reduce((s, v) => s + esperadoMes(1000, v, '2024-04-10') + esperadoMes(500, v, '2024-04-10'), 0);
  confere('21. total das duas séries', r.total, esp, 0.03);
  confere('21. seis prestações no cálculo', r.itens.filter(i => i.serie).length, 6);
}
// 22) Mês pago e meses a vencer ficam de fora
{
  const s = serie('A', 'Aluguel', '2024-01', '2024-06', 1000); s.meses[1].pago = true;
  const r = calc({ series: [s] }, '2024-04-15');
  confere('22. prestações incluídas (jan, mar, abr)', r.itens.filter(i => i.serie).length, 3);
  confere('22. a vencer (mai, jun)', r.aVencer, 2);
}
// 23) Juros desde uma data única (citação)
{
  const r = calc({ series: [serie('A', 'Aluguel', '2024-01', '2024-01', 1000, { juros: 'data', jurosData: '2024-03-01' })] }, '2024-04-10');
  const corr = 1000 * Math.pow(1.01, 3);
  confere('23. juros desde a citação', r.itens[0].juros, corr * 0.01 / 30 * diasEntre('2024-03-01', '2024-04-10'));
}
// 24) Reajuste anual pelo índice acumulado dos 12 meses anteriores
{
  const v = valoresDaSerie('2023-01', '2024-04', 1000, { ativo: true, indice: 'IPCA', mes: 3 });
  confere('24. antes do aniversário', v.valores['2023-02'], 1000);
  confere('24. depois do 1º reajuste', v.valores['2023-03'], r2(1000 * Math.pow(1.01, 12)));
  confere('24. depois do 2º reajuste', v.valores['2024-03'], r2(r2(1000 * Math.pow(1.01, 12)) * Math.pow(1.01, 12)));
}
// 25) Honorários sem uma série na base, pagamento só numa série e acordo com a série agrupada
{
  const sA = serie('A', 'Aluguel', '2024-01', '2024-02', 1000), sC = serie('C', 'Condomínio', '2024-01', '2024-02', 500);
  const c = { tipo: 'judicial', rubricas: [], custas: [], multas: [], series: [sA, sC], honorarios: [{ id: 'h1', forma: 'condenacao', pct: 10, fora: ['serie:C'] }],
    amortizacoes: [{ data: '2024-02-20', valor: 300, imputacao: 'juros', destino: 'serie:C' }] };
  const r = calcular(c, '2024-03-10');
  const alug = ['2024-01-10', '2024-02-10'].reduce((s, v) => s + esperadoMes(1000, v, '2024-03-10'), 0);
  confere('25. honorários só sobre o aluguel', r.itens.find(i => i.itemId === 'h1').total, alug * 0.1, 0.03);
  confere('25. pagamento abatido só do condomínio', r.amort[0].imputado.every(l => l.rotulo.startsWith('Condomínio')) ? 1 : 0, 1);
  const ra = calcularAcordo(c, { data: '2024-03-10', desconto: { modo: 'total', tipo: 'pct', valor: 0 }, sinal: { tipo: 'valor', valor: 0 }, parcelas: { modo: 'numero', n: 1, taxa: 0, primeiro: '2024-04-10' } });
  confere('25. acordo com uma linha por série', ra.itens.filter(i => i.itemId.startsWith('serie:')).length, 2);
}

document.getElementById('saida').innerHTML = `<p><b>${res.filter(x => x.ok).length} de ${res.length} conferências corretas</b></p>` +
  res.map(x => `<div class="${x.ok ? 'ok' : 'erro'}">${x.ok ? '✔' : '✘'} ${x.nome}: obtido ${x.obtido?.toFixed?.(4)} · esperado ${x.esperado.toFixed(4)}</div>`).join('');
window.resultadoTestes = res;
</script></body></html>
